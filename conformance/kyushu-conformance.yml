    detail: >-
      The JPCOAR schema supports ORCID via jpcoar:nameIdentifier with nameIdentifierScheme="ORCID",
      but no nameIdentifier of any scheme appeared in the live records sampled from the `rare` and
      `coal` sets, and no ORCID consortium or member registration for Kyushu University was
      evidenced in this run. Recorded as false rather than omitted; the capability exists in the
      schema and is not being exercised in the records observed.
