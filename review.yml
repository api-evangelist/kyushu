reviews:
  - date: '2026-09-01'
    rating: 3
    summary: >-
      Re-profiled under the API Evangelist university pipeline, which settles WHO OPERATES each
      surface before saving anything. Kyushu came into this run already clean of the Figshare/Pure
      misattribution that contaminated this cohort, and the re-profile added the operator axis plus
      six surfaces the June 2026 pass missed entirely. The one genuinely institution-operated API is
      the QIR OAI-PMH 2.0 endpoint on the university's own catalog.lib.kyushu-u.ac.jp — unusual for
      a Japanese national university, most of which are tenants on NII JAIRO Cloud. All six verbs
      were exercised live and five protocol error codes were reproduced by deliberately malformed
      requests. Newly recorded: Kyushu's own SAML 2.0 Shibboleth IdP in GakuNin (registered
      2011-02-18, exported to eduGAIN) plus two of its own SAML service providers; a DataCite
      consortium-organization membership under the Japan Link Center with prefix 10.48708; two
      Crossref memberships; the ROR record; the Genkai supercomputer estate; and the Elsevier Pure
      tenancy. That last one is the trap this pipeline exists to catch — the Pure tenant serves a
      live 827-path OpenAPI titled "Pure API" with contact pure-support@elsevier.com and a relative
      `/ws/api` server block that makes it invisible to a host-based ownership check. The
      relationship is recorded; Elsevier's contract is deliberately not saved here. Two real defects
      were measured rather than smoothed: the IdP's own metadata URL returns HTTP 200 carrying a
      Shibboleth filesystem error instead of an EntityDescriptor, and the library host intermittently
      drops connections and succeeds on retry.
    endpoints:
      - url: https://catalog.lib.kyushu-u.ac.jp/mmd/mmd_api/oai-pmh/?verb=Identify
        status: 200
        note: repositoryName "Kyushu University Institutional Repository (QIR)", protocolVersion 2.0, earliestDatestamp 2006-08-16, adminEmail qir@jimu.kyushu-u.ac.jp.
