      - url: https://catalog.lib.kyushu-u.ac.jp/mmd/mmd_api/oai-pmh/?verb=ListSets
        status: 200
        note: Seven sets. `hydro` and `qir` are on the wire but absent from the documentation; `papers` is advertised but documented as NOT served over OAI-PMH.
      - url: https://metadata.gakunin.nii.ac.jp/gakunin-metadata.xml
