apis:
  - aid: kyushu:qir-oai-pmh
    name: Kyushu University Institutional Repository (QIR) OAI-PMH
    x-operator: institution
    description: >-
      Live OAI-PMH 2.0 metadata harvesting interface for the Kyushu University Institutional
      Repository (QIR) and the library's other digital collections, run by Kyushu University
      Library on the university's own registrable domain. The protocol implementation as well as
      the collection is the institution's — there is no vendor host in the path — which is why this
      is the rare university repository surface graded x-operator: institution rather than tenant.
      Verified live 2026-09-01 across all six verbs. Identify returns repositoryName "Kyushu
      University Institutional Repository (QIR)", protocolVersion 2.0, adminEmail
      qir@jimu.kyushu-u.ac.jp, earliestDatestamp 2006-08-16, deletedRecord transient, granularity
      to the second. ListMetadataFormats returns jpcoar, jpcoar_2.0, junii2 and oai_dc, though the
      library documents only JPCOAR as fully supported. ListSets returns seven sets — coal,
      dissertation, hydro, papers, rare, seals, qir — two of which (hydro, qir) appear on the wire
      but not in the documentation, while `papers` is advertised by ListSets and documented as NOT
      served. Anonymous, no key, no rate-limit headers; a list response caps at 500 records and
      pages with resumptionToken. Metadata is CC0 1.0 except QIR abstracts, which carry no licence
      grant. Protocol errors return HTTP 200 with a self-closing error element, so HTTP status is
      not a success signal here.
    humanURL: https://www.lib.kyushu-u.ac.jp/en/metadata
    baseURL: https://catalog.lib.kyushu-u.ac.jp/mmd/mmd_api/oai-pmh/
