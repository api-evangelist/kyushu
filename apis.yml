  - aid: kyushu:qir-bulk-tsv
    name: QIR / Kyushu University Collections Bulk Metadata (TSV via Handle)
    x-operator: institution
    description: >-
      Quarterly full-metadata TSV exports for the Kyushu University Library digital collections,
      distributed through the Handle system under the university's own 2324 prefix. Covers the
      institutional repository (QIR) as well as the rare materials, ownership seal image and coal
      mining image collections. This is how the `papers` set is obtained, since the library states
      it is not served over OAI-PMH. Bulk download rather than a query API; anonymous, no account,
      CC0 1.0 with QIR abstracts excluded from the licence grant. Handle 2324/6625737 verified live
      2026-09-01.
