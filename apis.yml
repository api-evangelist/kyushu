aid: kyushu
name: Kyushu University
x-type: university
x-category: Public Research University
description: >-
  Kyushu University (九州大学) is a Japanese national research university in Fukuoka, one of the seven
  former Imperial Universities and a Designated National University, ranked #171 in the QS World
  University Rankings 2027. Its programmable footprint is small and concentrated in scholarly
  infrastructure rather than in a developer platform, and this profile says so rather than padding
  it. Exactly one unambiguously institution-operated API was found and exercised end to end: the
  OAI-PMH 2.0 metadata interface for the Kyushu University Institutional Repository and the
  library's digital collections, at catalog.lib.kyushu-u.ac.jp. That endpoint is unusual for this
  cohort — most Japanese university repositories are tenants on NII's JAIRO Cloud, while Kyushu
  runs the protocol implementation itself on its own registrable domain, with a kyushu-u.ac.jp
  administrative contact, four metadata formats and seven collection sets. Everything else is a
  relationship rather than a contract: the university operates its own SAML 2.0 Shibboleth Identity
  Provider registered in the GakuNin national federation since 2011 and exported to eduGAIN; it is
  a DataCite consortium organization under the Japan Link Center and a Crossref member through two
  units; its research portal is an Elsevier Pure tenant whose live OpenAPI is Elsevier's contract,
  not Kyushu's, and is deliberately not saved here. There is no central developer portal, no API
  key issuance, no open-data platform, no llms.txt, no MCP server and no OpenAPI published anywhere
  on kyushu-u.ac.jp. The public syllabus and the Genkai supercomputer portals are HTML and login
  walls, not APIs.
