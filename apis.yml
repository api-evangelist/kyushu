  - aid: kyushu:pure-research-portal
    name: Kyushu University Pure Research Portal (Elsevier tenant)
    x-operator: tenant
    description: >-
      Kyushu University's research information portal, an Elsevier Pure tenant at
      kyushu-u.elsevierpure.com. The researchers, publications, organizational units and research
      outputs behind it are the university's; the software and the contract are Elsevier's. The
      tenant serves a live OpenAPI at /ws/api/openapi.json — 360 KB, 827 paths, info.title "Pure
      API", info.version 5.36.2-1, info.contact.email pure-support@elsevier.com, and a relative
      servers block of `/ws/api` that leaves it with no hostname of its own. That relative server
      block is exactly the `hostless` failure class this pipeline exists to catch: a host-based
      ownership check is blind to it, and it is how Elsevier Pure contracts have been credited to
      universities elsewhere in this cohort. The relationship is recorded here; the contract is
      deliberately NOT saved into this repository and belongs to Elsevier's own profile. Note also
      that /en/ on the tenant returns HTTP 403 to an automated client while / returns 200.
    humanURL: https://kyushu-u.elsevierpure.com/
    baseURL: https://kyushu-u.elsevierpure.com/ws/api
    tags: [ Research Portal, Elsevier Pure, CRIS, Tenant, Research Information ]
    properties:
