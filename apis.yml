x-coverage:
  state: covered
  reason: covered
  detail: >-
    The public surface was reached with no wall of consequence, in Japanese as well as English. One
    genuinely institution-operated API was found and exercised anonymously end to end — the QIR
    OAI-PMH 2.0 endpoint on the university's own catalog.lib.kyushu-u.ac.jp — across all six verbs,
    with five distinct protocol error codes reproduced by deliberately malformed requests. Kyushu's
    Shibboleth IdP was confirmed inside the 5.65 MB GakuNin aggregate metadata and independently in
    the eduGAIN technical API; the DataCite provider record, two Crossref memberships and the ROR
    record were confirmed against their registries' APIs. The absences are real, not blocked:
    kyushu-u.ac.jp serves no llms.txt, no OpenAPI, no MCP server, no agent card and no developer
    portal, and returns HTTP 403 on /.well-known/ paths rather than 404. The public syllabus at
    syllabus.kyushu-u.ac.jp and the Fujitsu Campusmate portal behind it are HTML search forms with
    no JSON interface; the three Genkai supercomputer portals are live login walls. The single
    vendor contract on the estate — the Elsevier Pure tenant's live 827-path "Pure API" OpenAPI at
    kyushu-u.elsevierpure.com/ws/api/openapi.json, servers `/ws/api`, contact
    pure-support@elsevier.com — was identified and deliberately not saved; the tenancy is recorded
    instead. Two operational defects were measured rather than smoothed: the IdP's own metadata URL
    returns 200 with a filesystem error string instead of an EntityDescriptor, and the OAI-PMH host
    intermittently drops connections and succeeds on retry.
