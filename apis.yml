        url: authentication/kyushu-authentication.yml
      - type: VendorProfile
        url: https://kyushu-u.elsevierpure.com/
  - aid: kyushu:genkai-research-computing
    name: Genkai Supercomputer System (Research Institute for Information Technology)
    x-operator: institution
    description: >-
      Kyushu University's research computing service, operated by the Research Institute for
      Information Technology (RIIT) around the Genkai supercomputer. Three machine-facing portals
      run on the university's own hpc.kyushu-u.ac.jp domain and all answered HTTP 200 on
      2026-09-01 — a user application portal, a reservation portal and an Open OnDemand instance —
      but every one of them is a login wall, with access granted through an application and fee
      process rather than by issuing API credentials. No public API, no token format and no scope
      list is published. Recorded as an institution-operated surface with an honest note that it is
      auth_required, not as a callable API. RIIT also maintains the associated open-source work in
      public: the WHEEL HPC workflow system and CBrick, in the RIIT-KyushuUniv GitHub organization.
    humanURL: https://www.cc.kyushu-u.ac.jp/scp/
    baseURL: https://genkai-portal.hpc.kyushu-u.ac.jp/user-portal/
    tags: [ Research Computing, HPC, Supercomputing, Open OnDemand, Allocation ]
    properties:
      - type: Authentication
        url: authentication/kyushu-authentication.yml
      - type: SourceCode
        url: https://github.com/RIIT-KyushuUniv
