  - aid: kyushu:gakunin-shibboleth-idp
    name: GakuNin Shibboleth Identity Provider
    x-operator: federation
    description: >-
      Kyushu University's own SAML 2.0 Identity Provider, registered in GakuNin — the Japanese
      academic access-management federation operated by NII — and exported to eduGAIN. entityID
      https://idp.kyushu-u.ac.jp/idp/shibboleth, OrganizationName "Kyushu University / 九州大学",
      shibmd:Scope kyushu-u.ac.jp, registered 2011-02-18 under registrationAuthority
      https://www.gakunin.jp. Declares SingleSignOnService over HTTP-POST, HTTP-Redirect and the
      legacy Shibboleth 1.0 AuthnRequest profile, and SingleLogoutService over HTTP-POST and
      HTTP-Redirect with async-SLO support. Two further Kyushu entities are registered as its own
      service providers — the ShareAid shared research-equipment reservation portal and a REDCap
      instance in the medical faculty. A federation is shared by definition, but the IdP behind it
      is the institution's, and this is the strongest machine-readable surface Kyushu operates
      after the OAI-PMH endpoint. One real defect found: the IdP's own metadata URL returns HTTP
      200 carrying a 115-byte Shibboleth filesystem error rather than an EntityDescriptor, so the
      GakuNin aggregate is the only working source for this entity.
    humanURL: https://www.gakunin.jp/en/
    baseURL: https://metadata.gakunin.nii.ac.jp/gakunin-metadata.xml
    tags: [ SAML, Shibboleth, Identity Federation, GakuNin, eduGAIN, Single Sign-On ]
    properties:
